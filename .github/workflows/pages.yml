name: Deploy Round Dice Web Installer

on:
  workflow_run:
    workflows: ["Build Round Dice firmware"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current firmware
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o web/firmware.bin https://github.com/E1d0k4/RoundDice/releases/download/test-latest/round-dice-installer.bin
          test -s web/firmware.bin
          ls -lh web/firmware.bin

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
